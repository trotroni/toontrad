<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Page en dev</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            background: #0b0b0b;
            color: #e0e0e0;
            font-family: system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .box {
            text-align: center;
            max-width: 75%;
        }

        h1 {
            font-size: 350%;
            margin-bottom: 20px;
        }

        .red {
            color: #ff3b3b;
        }

        .blue {
            color: #3b82ff;
        }

        .white {
            color: white;
        }

        p {
            opacity: 0.75;
        }

        .code {
            opacity: 0.5;
            margin-top: 10px;
        }

        .progress-container {
            width: 300px;
            margin: 25px auto 0; /* centre horizontalement */
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar {
            width: 5%;
            height: 25px;
            background: #ff0000;
            text-align: center;
            color: white;
            line-height: 25px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>
        <span class="blue">Projet en cours</span>
        <span class="white">de</span>
        <span class="red">développement</span>
    </h1>

    <p>Cette page est en cours de développement</p>
    <div class="code">Contact : <b>trotroni@outlook.com</b></div>

    <div class="progress-container">
        <div class="progress-bar">
        </div>
    </div>
    <h3>5%</h3>
</div>

</body>
</html>
