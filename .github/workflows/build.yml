name: Build & Draft Release

env:
  RELEASE_TEMPLATE: .github/RELEASE_TEMPLATE/RELEASE_TEMPLATE_1.md
  CHANGELOG_FILE:   .github/RELEASE_TEMPLATE/CHANGELOG_NEXT.md
  MANUAL_VERSION:   "v2.0.0-beta"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version tag (ex: v1.0.0)'
        required: true

permissions:
  contents: write

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  #  macOS Universal Binary (Intel + Apple Silicon)
  # ═══════════════════════════════════════════════════════════════════════════
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Qt6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true

      - name: Installer dépendances Python
        run: |
          python3 -m pip install --upgrade pip
          pip3 install cairosvg Pillow --quiet
          pip3 install -r requirements.txt --quiet || true

      - name: Configure CMake (Universal Binary)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build
        run: cmake --build build --config Release -j$(sysctl -n hw.ncpu)

      - name: macdeployqt
        run: |
          "$Qt6_DIR/bin/macdeployqt" "build/ToonTrad.app" -always-overwrite

      - name: Créer le DMG
        run: |
          APP="build/ToonTrad.app"
          DMG="ToonTrad-macOS-Universal.dmg"
          TMP="/tmp/tt_universal.dmg"

          hdiutil create -size 300m -fs HFS+ -volname "ToonTrad" "$TMP" -ov -quiet
          hdiutil attach "$TMP" -mountpoint /Volumes/ToonTrad -quiet
          cp -r "$APP" /Volumes/ToonTrad/
          ln -s /Applications /Volumes/ToonTrad/Applications

          # ── Configuration Finder (AppleScript simplifié) ──────────────────
          # On évite "arrangement" qui échoue sur certains runners macOS CI
          osascript <<'EOF'
          tell application "Finder"
            tell disk "ToonTrad"
              open
              delay 3
              tell container window
                set current view to icon view
                set toolbar visible to false
                set statusbar visible to false
                set the bounds to {200, 150, 780, 520}
                set position of item "ToonTrad.app" to {170, 180}
                set position of item "Applications"  to {430, 180}
                close
                open
                delay 1
                close
              end tell
            end tell
          end tell
          EOF

          hdiutil detach /Volumes/ToonTrad -quiet
          hdiutil convert "$TMP" -format UDZO -o "$DMG" -ov -quiet
          rm "$TMP"

      - name: Upload artifact macOS
        uses: actions/upload-artifact@v4
        with:
          name: ToonTrad-macOS
          path: ToonTrad-macOS-Universal.dmg

  # ═══════════════════════════════════════════════════════════════════════════
  #  Windows x64
  # ═══════════════════════════════════════════════════════════════════════════
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Qt6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Installer NSIS
        run: choco install nsis --yes --no-progress

      - name: Installer GTK (libcairo pour cairosvg)
        run: choco install gtk-runtime --yes --no-progress
        continue-on-error: true

      - name: Installer dépendances Python
        run: |
          pip install cairosvg Pillow svglib reportlab --quiet
          pip install -r requirements.txt --quiet
        continue-on-error: true

      - name: Configure CMake
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: windeployqt + staging
        shell: pwsh
        run: |
          $exe = "build\Release\ToonTrad.exe"
          if (!(Test-Path $exe)) { $exe = "build\ToonTrad.exe" }

          New-Item -ItemType Directory -Force -Path "build\staging" | Out-Null
          Copy-Item $exe "build\staging\" -Force

          & "$env:Qt6_DIR\bin\windeployqt.exe" "build\staging\ToonTrad.exe" `
            --release --no-translations --no-system-d3d-compiler

          Copy-Item "python"    "build\staging\python"    -Recurse -Force
          Copy-Item "resources" "build\staging\resources" -Recurse -Force

      - name: Générer installateur NSIS
        shell: pwsh
        run: |
          cd build
          cpack -G NSIS -V
          Get-ChildItem *.exe | Rename-Item -NewName "ToonTrad-Windows-x64.exe"

      - name: Upload artifact Windows
        uses: actions/upload-artifact@v4
        with:
          name: ToonTrad-Windows
          path: build\ToonTrad-Windows-x64.exe

  # ═══════════════════════════════════════════════════════════════════════════
  #  Draft Release
  # ═══════════════════════════════════════════════════════════════════════════
  draft-release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Télécharger tous les artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Lister les artifacts
        run: find artifacts/ -type f

      - name: Résoudre la version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.version_override }}"
          fi
          VERSION="${TAG#v}"
          DATE=$(date +%Y-%m-%d)
          echo "tag=$TAG"         >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$DATE"       >> $GITHUB_OUTPUT
          echo "Résolu → tag=$TAG | version=$VERSION | date=$DATE"

      - name: Vérifier les fichiers requis
        run: |
          missing=0
          for f in "${{ env.RELEASE_TEMPLATE }}" "${{ env.CHANGELOG_FILE }}"; do
            if [ ! -f "$f" ]; then
              echo "ERREUR : fichier introuvable → $f"
              missing=1
            else
              echo "OK : $f"
            fi
          done
          [ $missing -eq 0 ] || exit 1

      - name: Assembler les release notes
        run: |
          python3 - <<'PYEOF'
          import re, os

          template_path  = os.environ["TEMPLATE"]
          changelog_path = os.environ["CHANGELOG"]
          tag     = os.environ["TAG"]
          version = os.environ["VERSION"]
          date    = os.environ["DATE"]

          with open(template_path,  encoding="utf-8") as f:
              template = f.read()
          with open(changelog_path, encoding="utf-8") as f:
              changelog = f.read().strip()

          parts = re.split(r'\n---\n', template)
          if len(parts) < 3:
              result = template
          else:
              footer = "\n---\n".join(parts[2:])
              result = parts[0] + "\n---\n" + changelog + "\n\n---\n" + footer

          result = result.replace("{TAG}",     tag)
          result = result.replace("{VERSION}", version)
          result = result.replace("{DATE}",    date)

          with open("/tmp/release_notes.md", "w", encoding="utf-8") as f:
              f.write(result)

          print("=== Aperçu (800 premiers caractères) ===")
          print(result[:800])
          PYEOF
        env:
          TEMPLATE:  ${{ env.RELEASE_TEMPLATE }}
          CHANGELOG: ${{ env.CHANGELOG_FILE }}
          TAG:       ${{ steps.version.outputs.tag }}
          VERSION:   ${{ steps.version.outputs.version }}
          DATE:      ${{ steps.version.outputs.date }}

      - name: Créer la draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name:  ${{ steps.version.outputs.tag }}
          name:      "ToonTrad ${{ steps.version.outputs.tag }}"
          body_path: /tmp/release_notes.md
          files: |
            artifacts/*.dmg
            artifacts/*.exe
